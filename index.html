<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Vault</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>💿 Vinyl Vault</h1>
        <div id="stats" class="stats-count">0 vinyle(s)</div>
    </header>

    <div class="main-layout">
        <!-- Recherche Discogs -->
        <div class="panel">
            <h3 class="panel-title">Rechercher sur Discogs</h3>
            <div class="form-group">
                <input type="text" id="discogs-search" placeholder="Artiste, album...">
            </div>
            <button class="btn btn-discogs" id="btn-search">🔍 Chercher sur Discogs</button>

            <div id="discogs-results" class="discogs-results" style="display: none;"></div>
        </div>

        <!-- Collection -->
        <div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="🔍 Filtrer ma collection...">
            </div>
            <div class="vinyl-grid" id="vinyl-grid"></div>
        </div>
    </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
