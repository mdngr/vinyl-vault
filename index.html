<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Vault</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="container">
    <!-- Header Responsive -->
    <header>
        <div class="header-left">
            <h1>🏛️ Culture Vault</h1>
            <div id="stats" class="stats-count">0 élément(s)</div>
        </div>
        <div class="header-right">
            <button id="btn-auth" class="btn btn-login">
                <span class="auth-icon">🔒</span>
                <span class="auth-text">Connexion Admin</span>
            </button>
        </div>
    </header>

    <!-- Filtres par catégorie & recherche + Switcher de Vue -->
    <div class="controls-bar">
        <div class="controls-top">
            <div class="category-tabs">
                <button class="tab-btn active" data-type="all">Tous</button>
                <button class="tab-btn" data-type="vinyl">💿 Vinyles</button>
                <button class="tab-btn" data-type="book">📚 Livres & BDs</button>
                <button class="tab-btn" data-type="movie">🎬 DVDs / Blu-ray</button>
            </div>

            <!-- Switcher de Vue -->
            <div class="view-switcher">
                <button id="btn-view-grid" class="view-btn" title="Vue Grille">🧱</button>
                <button id="btn-view-list" class="view-btn" title="Vue Liste">☰</button>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 Filtrer ma bibliothèque...">
        </div>
    </div>

    <!-- Bloc d'administration / Ajout (Masqué par défaut) -->
    <div class="panel" id="admin-panel" style="display: none;">
        <h3 class="panel-title">Ajouter une œuvre</h3>
        
        <div class="form-row">
            <select id="media-type-select">
                <option value="vinyl">💿 Vinyle (Discogs)</option>
                <option value="book">📚 Livre / BD (Open Library & Google Books)</option>
                <option value="movie">🎬 DVD / Blu-Ray (TMDB)</option>
            </select>
            <input type="text" id="api-search-input" placeholder="Titre, auteur, code-barres (EAN/ISBN)...">
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="btn-search">🔍 Rechercher</button>
            <button class="btn btn-scan" id="btn-scan">📷 Scanner Code-Barres</button>
        </div>

        <div id="api-results" class="discogs-results" style="display: none;"></div>
    </div>

    <!-- Grille ou Liste des éléments -->
    <div class="vinyl-grid" id="vinyl-grid"></div>
</div>

<!-- Modal Connexion Admin -->
<div id="login-modal" class="modal" style="display: none;">
    <div class="modal-content login-content">
        <div class="modal-header">
            <h3>🔒 Espace Administrateur</h3>
            <button id="btn-close-login" class="btn-close" type="button">✕</button>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required placeholder="ton-email@exemple.com">
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </div>
</div>

<!-- Modal Édition d'un élément -->
<div id="edit-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ Modifier l'élément</h3>
            <button id="btn-close-edit" class="btn-close" type="button">✕</button>
        </div>
        <form id="edit-form">
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label for="edit-title">Titre</label>
                <input type="text" id="edit-title" required>
            </div>
            
            <div class="form-group">
                <label for="edit-artist">Auteur / Artiste / Réalisateur</label>
                <input type="text" id="edit-artist" required>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label for="edit-year">Année</label>
                    <input type="text" id="edit-year" placeholder="Ex: 2024">
                </div>
                <div class="form-group" style="flex:1;">
                    <label for="edit-type">Catégorie</label>
                    <select id="edit-type">
                        <option value="vinyl">💿 Vinyle</option>
                        <option value="book">📚 Livre / BD</option>
                        <option value="movie">🎬 DVD / Blu-Ray</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="edit-genre">Genre</label>
                <input type="text" id="edit-genre" placeholder="Ex: Rock, Sci-Fi, BD...">
            </div>

            <div class="form-group">
                <label for="edit-cover">URL de la pochette / jaquette</label>
                <input type="url" id="edit-cover" placeholder="https://...">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:10px;">Enregistrer les modifications</button>
        </form>
    </div>
</div>

<!-- Modal Scanner Caméra -->
<div id="scanner-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📷 Scanner le code-barres</h3>
            <button id="btn-close-scanner" class="btn-close" type="button">✕</button>
        </div>
        <div id="reader"></div>
        
        <div id="zoom-container" class="zoom-container" style="display: none;">
            <span>🔍 1x</span>
            <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
            <span id="zoom-value">1x</span>
        </div>

        <p class="scan-instruction">Place le code-barres EAN / ISBN dans le rectangle.</p>
    </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
