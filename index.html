<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Vault</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <h1>🏛️ Culture Vault</h1>
            <div id="stats" class="stats-count">0 élément(s)</div>
        </div>
        <div class="header-right">
            <button id="btn-auth" class="btn btn-login">🔒 Connexion Admin</button>
        </div>
    </header>

    <!-- Filtres par catégorie & recherche -->
    <div class="controls-bar">
        <div class="category-tabs">
            <button class="tab-btn active" data-type="all">Tous</button>
            <button class="tab-btn" data-type="vinyl">💿 Vinyles</button>
            <button class="tab-btn" data-type="book">📚 Livres & BDs</button>
            <button class="tab-btn" data-type="movie">🎬 DVDs / Blu-ray</button>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 Filtrer ma bibliothèque...">
        </div>
    </div>

    <!-- Bloc d'administration / Ajout -->
    <div class="panel" id="admin-panel" style="display: none;">
        <h3 class="panel-title">Ajouter une œuvre</h3>
        
        <div class="form-row">
            <select id="media-type-select">
                <option value="vinyl">💿 Vinyle (Discogs)</option>
                <option value="book">📚 Livre / BD (Open Library & Google Books)</option>
                <option value="movie">🎬 DVD / Blu-Ray (TMDB)</option>
            </select>
            <input type="text" id="api-search-input" placeholder="Titre, auteur, code-barres (EAN/ISBN)...">
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="btn-search">🔍 Rechercher</button>
            <button class="btn btn-scan" id="btn-scan">📷 Scanner Code-Barres</button>
        </div>

        <div id="api-results" class="discogs-results" style="display: none;"></div>
    </div>

    <!-- Grille Masonry -->
    <div class="vinyl-grid" id="vinyl-grid"></div>
</div>

<!-- Modal Connexion Admin -->
<div id="login-modal" class="modal" style="display: none;">
    <div class="modal-content login-content">
        <div class="modal-header">
            <h3>🔒 Espace Administrateur</h3>
            <button id="btn-close-login" class="btn-close" type="button">✕</button>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required placeholder="ton-email@exemple.com">
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </div>
</div>

<!-- Modal Scanner Caméra -->
<div id="scanner-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📷 Scanner le code-barres</h3>
            <button id="btn-close-scanner" class="btn-close">✕</button>
        </div>
        <div id="reader"></div>
        <p class="scan-instruction">Place le code-barres EAN / ISBN dans le rectangle.</p>
    </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
