<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Vault</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>💿 Vinyl Vault</h1>
        <div id="stats" class="stats-count">0 vinyle(s)</div>
    </header>

    <div class="main-layout">
        <!-- Recherche Discogs & Scan -->
        <div class="panel">
            <h3 class="panel-title">Rechercher sur Discogs</h3>
            <div class="form-group">
                <input type="text" id="discogs-search" placeholder="Artiste, album, code-barres...">
            </div>
            
            <div class="btn-group">
                <button class="btn btn-discogs" id="btn-search">🔍 Chercher</button>
                <button class="btn btn-scan" id="btn-scan">📷 Scanner Code-Barres</button>
            </div>

            <div id="discogs-results" class="discogs-results" style="display: none;"></div>
        </div>

        <!-- Collection -->
        <div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="🔍 Filtrer ma collection...">
            </div>
            <div class="vinyl-grid" id="vinyl-grid"></div>
        </div>
    </div>
</div>

<!-- Modal Scanner Caméra -->
<div id="scanner-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📷 Scanner le vinyle</h3>
            <button id="btn-close-scanner" class="btn-close">✕</button>
        </div>
        <div id="reader"></div>
        <p class="scan-instruction">Place le code-barres au dos du vinyle devant la caméra.</p>
    </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
