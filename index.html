<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Vault</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <h1>💿 Vinyl Vault</h1>
            <div id="stats" class="stats-count">0 vinyle(s)</div>
        </div>
        <div class="header-right">
            <button id="btn-auth" class="btn btn-login">🔒 Connexion Admin</button>
        </div>
    </header>

    <!-- Barre de recherche Full Width -->
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 Filtrer ma collection...">
    </div>

    <!-- Bloc d'administration (masqué par défaut) -->
    <div class="panel" id="admin-panel" style="display: none;">
        <h3 class="panel-title">Rechercher & Ajouter un vinyle</h3>
        <div class="form-group">
            <input type="text" id="discogs-search" placeholder="Artiste, album, code-barres...">
        </div>
        
        <div class="btn-group">
            <button class="btn btn-discogs" id="btn-search">🔍 Chercher sur Discogs</button>
            <button class="btn btn-scan" id="btn-scan">📷 Scanner Code-Barres</button>
        </div>

        <div id="discogs-results" class="discogs-results" style="display: none;"></div>
    </div>

    <!-- Grille Masonry -->
    <div class="vinyl-grid" id="vinyl-grid"></div>
</div>

<!-- Modal Connexion Admin -->
<div id="login-modal" class="modal" style="display: none;">
    <div class="modal-content login-content">
        <div class="modal-header">
            <h3>🔒 Espace Administrateur</h3>
            <button id="btn-close-login" class="btn-close">✕</button>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required placeholder="ton-email@exemple.com">
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-discogs">Se connecter</button>
        </form>
    </div>
</div>

<!-- Modal Scanner Caméra -->
<div id="scanner-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📷 Scanner le vinyle</h3>
            <button id="btn-close-scanner" class="btn-close">✕</button>
        </div>
        <div id="reader"></div>
        <p class="scan-instruction">Place le code-barres au dos du vinyle devant la caméra.</p>
    </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
