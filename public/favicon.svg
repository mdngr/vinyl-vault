  <!-- Socle du coffre -->
  <line x1="110" y1="388" x2="402" y2="388" stroke="#4a8cff" stroke-width="22" stroke-linecap="round"/>

  <!-- Disque / Sillons (Centré dans la voûte) -->
  <circle cx="256" cy="270" r="100" fill="#212229"/>
  <circle cx="256" cy="270" r="82" fill="none" stroke="#121318" stroke-width="10"/>
  <circle cx="256" cy="270" r="64" fill="none" stroke="#2b2c36" stroke-width="8"/>
  <circle cx="256" cy="270" r="46" fill="none" stroke="#121318" stroke-width="8"/>
  
  <!-- Macaron central bleu -->
  <circle cx="256" cy="270" r="28" fill="#3172e8"/>
  <!-- Trou central -->
  <circle cx="256" cy="270" r="8" fill="#121318"/>
